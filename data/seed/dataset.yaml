# dataset.yaml — sumber tunggal data sintetis Faktur Beres (versi 1)
#
# Dipakai oleh: seed Odoo (M0), generator faktur (M1), dan harness evaluasi (M5).
# Aturan:
# - Semua data FIKTIF. Domain email .test, bank fiktif, NPWP berawalan 0990. Digit cek NPWP
#   (digit ke-10) memenuhi Luhn agar lolos validasi format NPWP di Odoo/python-stdnum.
# - Jangan menaruh ID skenario atau label jawaban di berkas ini atau di Odoo.
#   Pemetaan skenario -> PO ada di docs/SPEC.md §15.3 dan eval/skenario/ (M1).
# - vendor_luar_erp TIDAK di-seed ke Odoo.
# - Nomor PO ditetapkan di sini (P00001 dst., urut tanggal pesan). Setelah seed,
#   sequence PO Odoo dimajukan agar PO baru dari UI tidak bertabrakan.
# - Setiap subtotal baris kelipatan Rp100 dan setiap subtotal dokumen kelipatan Rp300,
#   sehingga DPP nilai lain (11/12) dan PPN bulat tanpa pembulatan.
# - "catatan_riwayat" pada vendor hanya untuk tes konsistensi dataset. Seed tidak menyimpannya
#   ke Odoo; agent harus menyimpulkan vendor baru dari data Odoo (tanpa tagihan terposting).
# - Setiap perubahan wajib lolos tes dataset (kelipatan Rp100/Rp300, ambang, kepemilikan produk,
#   nomor PO unik, kebutuhan skenario di SPEC §15.3).
versi: 1
