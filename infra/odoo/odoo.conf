; Konfigurasi Odoo lokal Faktur Beres (RENCANA-TEKNIS §4.4). Tanpa rahasia.
; Sandi PostgreSQL datang dari env PGPASSWORD (compose.yaml), yang juga dipakai libpq untuk
; subperintah `odoo db ...`, `odoo module ...`, dan `odoo shell`.
[options]
data_dir = /var/lib/odoo
db_host = odoo-db
db_port = 5432
db_user = odoo
dbfilter = ^fakturberes$
list_db = False
proxy_mode = False
workers = 0
; Cron Odoo dimatikan. Thread cron memproses setiap database milik user `odoo`, termasuk
; snapshot fakturberes_seed, sehingga snapshot bisa berubah diam-diam. `db_name` tidak
; dipakai untuk membatasinya karena server lalu membuat database kosong otomatis saat mulai.
; Faktur Beres tidak bergantung pada cron Odoo. Efek sampingnya: antrean email Odoo tidak diproses.
max_cron_threads = 0
