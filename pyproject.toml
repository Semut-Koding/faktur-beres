[project]
name = "faktur-beres"
version = "0.1.0"
description = "AI agent yang menuntaskan exception faktur pemasok di proses accounts payable."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "python-stdnum>=2.2",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Dokumen ditulis tangan; formatter hanya untuk kode Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Skrip ORM yang dijalankan `odoo shell` di kontainer: `env` disediakan oleh Odoo.
"infra/odoo/shell/*.py" = ["F821"]
# Manifest addon Odoo adalah satu ekspresi dict, sesuai format Odoo.
"infra/odoo/addons/*/__manifest__.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
