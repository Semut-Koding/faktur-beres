[project]
name = "faktur-beres"
version = "0.1.0"
description = "AI agent yang menuntaskan exception faktur pemasok di proses accounts payable."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "google-genai>=2.34,<3",
    "httpx>=0.28.1",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-postgres>=2",
    "lxml>=6.1.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0,<5.15",
    "python-stdnum>=2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Dokumen ditulis tangan; formatter hanya untuk kode Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Skrip ORM yang dijalankan `odoo shell` di kontainer: `env` disediakan oleh Odoo.
"infra/odoo/shell/*.py" = ["F821"]
# Manifest addon Odoo adalah satu ekspresi dict, sesuai format Odoo.
"infra/odoo/addons/*/__manifest__.py" = ["B018"]
# Odoo memuat model lewat impor submodul di __init__.py addon.
"infra/odoo/addons/**/__init__.py" = ["F401"]
# Migrasi dibuat Alembic; daftar CHECK panjang dibiarkan satu baris.
"src/faktur_beres/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# `npm run typecheck`: the packages added in M2 and M3. Agent code and evaluation code are checked strictly.
files = [
    "src/faktur_beres/domain",
    "src/faktur_beres/tools",
    "src/faktur_beres/evals",
    "src/faktur_beres/llm",
    "src/faktur_beres/extraction",
    "src/faktur_beres/db",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Exception (RENCANA-TEKNIS §4.2): the M0–M1 modules are not part of `npm run typecheck`. mypy still
# reads them when the M2 packages import them, but does not report their own errors.
[[tool.mypy.overrides]]
module = [
    "faktur_beres.config",
    "faktur_beres.textui",
    "faktur_beres.odoo.*",
    "faktur_beres.dataset.*",
    "faktur_beres.seed.*",
    "faktur_beres.generator.*",
    "faktur_beres.devtools.*",
]
ignore_errors = true

# pypdfium2 ships without type information (no py.typed); its objects are typed as Any.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Odoo and are run only by `npm run test:integrasi`; LLM smoke
# tests call Gemini and are run only by `npm run test:llm`.
addopts = ["-ra", "--strict-markers", "-m", "not integrasi and not llm"]
markers = [
    "aturan(kode): tes untuk aturan bisnis SPEC §8 (mis. \"BR-10\"); dipakai tes keterlacakan",
    "integrasi: tes terhadap Odoo yang menyala (npm run test:integrasi, dengan odoo:reset)",
    "llm: tes smoke terhadap Gemini sungguhan (npm run test:llm; dilewati tanpa GEMINI_API_KEY)",
]
